name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fmt: ${{ steps.diff.outputs.fmt }}
      nocuda: ${{ steps.diff.outputs.nocuda }}
      cuda: ${{ steps.diff.outputs.cuda }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          fmt=false nocuda=false cuda=false
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=
            fmt=true nocuda=true cuda=true
          else
            files=$(git diff --name-only --no-renames "$BASE" "$HEAD")
            [ -n "$files" ] || { fmt=true nocuda=true cuda=true; }
          fi
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              *.md|LICENSE*|NOTICE*|.gitignore) ;;
              kernels/*.cu) cuda=true ;;
              kernels/*|device/*) [ "${f#device/}" = "$f" ] && nocuda=true; cuda=true ;;
              *.rs|Cargo.toml|Cargo.lock|rust-toolchain.toml|rustfmt.toml|.rustfmt.toml|clippy.toml|.github/*) fmt=true nocuda=true cuda=true ;;
              *) nocuda=true cuda=true ;;
            esac
            printf '%s\n' "$f"
          done <<< "$files"
          printf 'fmt=%s\nnocuda=%s\ncuda=%s\n' "$fmt" "$nocuda" "$cuda" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check

  clippy-no-cuda:
    needs: changes
    if: needs.changes.outputs.nocuda == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-cuda
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features --all-targets

  clippy-cuda:
    needs: changes
    if: needs.changes.outputs.cuda == 'true'
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    env:
      CUDA_ARCH_LIST: "8.6;8.9"
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Install build tools and Rust
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0 --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda-13.2-sm86-sm89
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST CUDA
      - name: Install pinned native device toolchain
        run: |
          rustup toolchain install nightly-2026-10-06 --profile minimal --component rust-src,llvm-tools,llvm-bitcode-linker,rustfmt,clippy --target nvptx64-nvidia-cuda
          RUSTFLAGS='-C target-cpu=sm_86' cargo +nightly-2026-10-06 build --manifest-path device/Cargo.toml --target nvptx64-nvidia-cuda -Z build-std=core --release
      - name: Check native device source
        run: |
          cargo +nightly-2026-10-06 fmt --manifest-path device/Cargo.toml --all --check
          RUSTFLAGS='-C target-cpu=sm_86' cargo +nightly-2026-10-06 clippy --manifest-path device/Cargo.toml --target nvptx64-nvidia-cuda -Z build-std=core --release --offline -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
