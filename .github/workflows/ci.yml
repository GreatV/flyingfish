name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (1.95.0 + clippy/rustfmt) on the
      # first cargo invocation; no toolchain action needed.
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # No --features cuda: runners have no nvcc.
      # CUDA-only examples are gated behind required-features and are skipped.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
