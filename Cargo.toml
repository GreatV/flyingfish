[package]
name = "flyingfish"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]
rocm = []

[dependencies]
anyhow = "1"
base64 = { version = "=0.13.1", default-features = false, features = ["std"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"
jpeg-decoder = { version = "=0.3.2", default-features = false }
png = { version = "=0.18.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
futures-util = "0.3"
cudarc = { optional = true, version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "cublaslt", "dynamic-loading", "cuda-version-from-build-system", "f16"] }
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
